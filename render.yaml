services:
  - type: web
    name: spiritual-sync
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: spiritual-sync-db
          property: connectionString

databases:
  - name: spiritual-sync-db
    plan: free
    databaseName: spiritual_sync
    user: spiritual_sync_user
